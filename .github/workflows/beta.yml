name: Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version, e.g. 0.3.1-beta.2"
        required: true
      notes:
        description: "Release notes (Markdown)"
        required: true

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gh (act only, GitHub runners have it)
        if: ${{ env.ACT }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gh
      - name: Check version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' > /tmp/tags.txt
          python3 scripts/check_beta_version.py "$VERSION" /tmp/tags.txt
      - name: Build zip
        run: python3 scripts/build_zip.py "${{ inputs.version }}" netz_noe_smartmeter.zip
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v${{ inputs.version }}" netz_noe_smartmeter.zip \
            --target "$GITHUB_SHA" --prerelease --title "v${{ inputs.version }}" --notes "$NOTES"
