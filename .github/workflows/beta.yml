name: Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version, e.g. 0.3.1-beta.2"
        required: true
      notes:
        description: "Release notes (Markdown)"
        required: true

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - name: Check version
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Version must look like 0.3.1-beta.2"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Build zip
        run: python3 scripts/build_zip.py "${{ inputs.version }}" netz_noe_smartmeter.zip
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "v${{ inputs.version }}" netz_noe_smartmeter.zip \
            --target "$GITHUB_SHA" --prerelease --title "v${{ inputs.version }}" --notes "$NOTES"
