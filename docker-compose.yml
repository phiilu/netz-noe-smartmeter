services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.3
    container_name: ha-dev
    ports:
      - "8124:8123"
    volumes:
      - ./ha-dev-config:/config
      - ./custom_components/netz_noe_smartmeter:/config/custom_components/netz_noe_smartmeter:ro
    environment:
      - TZ=Europe/Vienna
    restart: "no"

  # HACS end-to-end: `docker compose --profile hacs up -d hacs`, then install the integration through HACS
  hacs:
    image: ghcr.io/home-assistant/home-assistant:2026.10.3
    container_name: ha-hacs
    profiles: [hacs]
    ports:
      - "8125:8123"
    volumes:
      - ./ha-hacs-config:/config
    environment:
      - TZ=Europe/Vienna
    restart: "no"
